<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>西鉄電車 発車標レプリカ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');

  body {
    background-color: #121212;
    color: #ffffff;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    margin: 0;
    padding: 10px; /* ブラウザの左上に寄せるため余白を縮小 */
  }

  /* モニター外枠 */
  .monitor-frame {
    width: 620px;
    background-color: #080808;
    border: 8px solid #1a1a1a;
    border-radius: 4px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.9);
    overflow: hidden;
  }

  /* 画面ディスプレイ部分 */
  .screen {
    background: linear-gradient(to bottom, #001254 0%, #000a33 45%, #000312 80%, #000000 100%);
    display: flex;
    flex-direction: column;
    border: 2px solid #001a66;
  }

  /* 1列車分のブロック */
  .train-row {
    border-bottom: 2px solid #001855;
    display: flex;
    flex-direction: column;
  }
  .train-row:last-child {
    border-bottom: none;
  }

  /* 1行目（メイン情報） */
  .train-main {
    background-color: #000000;
    display: flex;
    align-items: center;
    padding: 6px 12px;
    position: relative;
  }

  /* 種別エリア */
  .type-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 85px;
    margin-right: 12px;
    flex-shrink: 0;
  }

  .type-badge {
    font-size: 21px;
    font-weight: 900;
    padding: 1px 8px;
    border-radius: 3px;
    text-align: center;
    letter-spacing: 1.5px;
    border: 2px solid #ffffff;
    line-height: 1.2;
    width: 100%;
    box-sizing: border-box;
  }
  .type-badge.local { background-color: #1e5799; color: #ffffff; border-color: #ffffff; }
  .type-badge.ltd-exp { background-color: #b30000; color: #ffffff; border-color: #ffffff; }
  .type-badge.express { background-color: #1b8a36; color: #ffffff; border-color: #ffffff; }

  .type-sub {
    font-size: 11px;
    font-weight: 700;
    color: #cccccc;
    margin-top: 1px;
    letter-spacing: 0.5px;
  }

  /* 行先エリア */
  .dest-area {
    display: flex;
    flex-direction: column;
    width: 150px;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .dest-main {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 3px;
    white-space: nowrap;
    line-height: 1.1;
  }
  .dest-sub {
    font-size: 11px;
    font-weight: 700;
    color: #cccccc;
    margin-top: 1px;
    letter-spacing: 1px;
  }

  /* 両数・ドア数エリア */
  .specs-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 50px;
    margin-right: 16px;
    gap: 2px;
    flex-shrink: 0;
  }
  .cars-box {
    background-color: #ffffff;
    color: #000000;
    font-size: 12px;
    font-weight: 900;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 1px;
  }
  .doors-badge {
    background-color: #cc0000;
    color: #ffffff;
    font-size: 10px;
    font-weight: 900;
    padding: 1px 5px;
    border-radius: 8px;
    white-space: nowrap;
    letter-spacing: 0.5px;
    border: 1px solid #ff4d4d;
  }

  /* 時刻エリア */
  .time-area {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1.5px;
    margin-left: auto;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  /* 2行目（お知らせ・接続案内行） */
  .notice-row {
    background: transparent;
    padding: 4px 12px 6px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .notice-line {
    display: flex;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
  }

  .notice-badge {
    background-color: #1e5799;
    color: #ffffff;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 2px;
    margin-right: 8px;
    border: 1px solid #4da6ff;
    letter-spacing: 1px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="monitor-frame">
  <div class="screen">

    <!-- 1本目：普通 小郡 (5両 3ドア) -->
    <div class="train-row">
      <div class="train-main">
        <div class="type-area">
          <div class="type-badge local">普 通</div>
          <div class="type-sub">一般</div>
        </div>
        <div class="dest-area">
          <div class="dest-main">小 郡</div>
          <div class="dest-sub">小郡</div>
        </div>
        <div class="specs-area">
          <div class="cars-box">5 両</div>
          <div class="doors-badge">3ドア</div>
        </div>
        <div class="time-area">9:55</div>
      </div>
      <div class="notice-row">
        <div class="notice-line">
          <span class="notice-badge">追越案内</span>
          大橋であとの特急に追越されます
        </div>
      </div>
    </div>

    <!-- 2本目：特急 大牟田 (6両 3ドア) -->
    <div class="train-row">
      <div class="train-main">
        <div class="type-area">
          <div class="type-badge ltd-exp">特 急</div>
          <div class="type-sub">特快</div>
        </div>
        <div class="dest-area">
          <div class="dest-main">大牟田</div>
          <div class="dest-sub">大牟田</div>
        </div>
        <div class="specs-area">
          <div class="cars-box">6 両</div>
          <div class="doors-badge">3ドア</div>
        </div>
        <div class="time-area">10:00</div>
      </div>
      <div class="notice-row">
        <div class="notice-line">
          <span class="notice-badge">乗換案内</span>
          太宰府方面は二日市で乗換です
        </div>
        <div class="notice-line" style="margin-top: 1px; margin-left: 50px;">
          北野・甘木方面は久留米で乗換です
        </div>
      </div>
    </div>

    <!-- 3本目：急行 太宰府 (5両 3ドア) -->
    <div class="train-row">
      <div class="train-main">
        <div class="type-area">
          <div class="type-badge express">急 行</div>
          <div class="type-sub">快车</div>
        </div>
        <div class="dest-area">
          <div class="dest-main">太宰府</div>
          <div class="dest-sub">太宰府</div>
        </div>
        <div class="specs-area">
          <div class="cars-box">5 両</div>
          <div class="doors-badge">3ドア</div>
        </div>
        <div class="time-area">10:16</div>
      </div>
      <div class="notice-row">
        <div class="notice-line">
          <span class="notice-badge">接続案内</span>
          大橋で普通電車に接続します
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
