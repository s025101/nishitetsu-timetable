<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西鉄電車 発車標レプリカ - iPad mini最適化</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Roboto:wght@700;900&display=swap');

  body {
    background-color: #121212;
    color: #ffffff;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    overflow-x: hidden;
  }

  /* 上部コントロールパネル */
  .control-panel {
    width: 100%;
    max-width: 720px;
    margin-bottom: 15px;
    background: #1a1a1a;
    padding: 10px 15px;
    border-radius: 6px;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 14px;
    box-sizing: border-box;
  }
  .control-panel select {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    padding: 5px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
  }

  /* iPad miniの画面横幅にジャストフィットさせる外枠 */
  .monitor-frame {
    width: 100%;
    max-width: 720px;
    background-color: #080808;
    border: 6px solid #1a1a1a;
    border-radius: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,0,0,0.9);
    overflow: hidden;
    box-sizing: border-box;
  }

  /* 画面ディスプレイ部分 */
  .screen {
    background: linear-gradient(to bottom, #001254 0%, #000a33 45%, #000312 80%, #000000 100%);
    display: flex;
    flex-direction: column;
    border: 2px solid #001a66;
  }

  /* 1列車分のブロック */
  .train-row {
    border-bottom: 2px solid #001855;
    display: flex;
    flex-direction: column;
  }
  .train-row:last-child {
    border-bottom: none;
  }

  /* 1行目（メイン情報） */
  .train-main {
    background-color: #000000;
    display: flex;
    align-items: center;
    padding: 10px 16px;
  }

  /* 種別エリア */
  .type-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 110px;
    margin-right: 28px; /* 種別と行先の間隔を広げる */
    flex-shrink: 0;
  }

  .type-badge {
    font-size: 26px;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 3px;
    text-align: center;
    letter-spacing: 6px; /* 種別の文字間にスペースを空ける */
    text-indent: 6px;    /* 全体が中央に寄る微調整 */
    border: 2px solid #ffffff;
    line-height: 1.2;
    width: 100%;
    box-sizing: border-box;
    color: #ffffff;
  }
  .type-badge.local { background-color: #002b80; }
  .type-badge.express { background-color: #008000; }
  .type-badge.limited { background-color: #cc0000; }

  .type-sub {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 2px;
    letter-spacing: 0.5px;
    font-family: 'Roboto', sans-serif;
  }

  /* 行先エリア */
  .dest-area {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    min-width: 0;
  }
  .dest-main {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 6px; /* 行先の文字間にスペースを空ける */
    text-indent: 6px;
    white-space: nowrap;
    line-height: 1.1;
  }
  .dest-sub {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 2px;
    letter-spacing: 0.5px;
    font-family: 'Roboto', sans-serif;
  }

  /* 右側グループ */
  .right-group {
    display: flex;
    align-items: center;
    gap: 22px;
    flex-shrink: 0;
    margin-left: 8px;
  }

  .specs-area {

    flex-direction: column;
    align-items: center;
