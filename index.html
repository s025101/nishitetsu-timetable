<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西鉄発車案内</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Roboto:wght@700;900&display=swap');

  body {
    background-color: #121212;
    color: #ffffff;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    overflow-x: hidden;
  }

  /* 上部コントロールパネルとモニターの共通ラッパー（幅を基準にする） */
  .wrapper {
    width: 370px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transform-origin: top center; /* 縮小・拡大の基準点を上部に設定 */
    transition: transform 0.2s ease; /* 向きを変えたときに滑らかに調整 */
  }

  /* 上部コントロールパネル */
  .control-panel {
    width: 100%;
    background: #1a1a1a;
    padding: 8px 12px;
    border-radius: 6px;
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 13px;
    box-sizing: border-box;
  }
  .control-panel select {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    width: 100%;
  }

  /* モニターフレーム */
  .monitor-frame {
    width: 100%;
    background-color: #080808;
    border: 4px solid #1a1a1a;
    border-radius: 4px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.9), inset 0 0 8px rgba(0,0,0,0.9);
    overflow: hidden;
    box-sizing: border-box;
  }

  /* 画面ディスプレイ部分 */
  .screen {
    background: linear-gradient(to bottom, #001254 0%, #000a33 45%, #000312 80%, #000000 100%);
    display: flex;
    flex-direction: column;
    border: 2px solid #001a66;
  }

  /* 1列車分のブロック */
  .train-row {
    border-bottom: 2px solid #001855;
    display: flex;
    flex-direction: column;
  }
  .train-row:last-child {
    border-bottom: none;
  }

  /* 1行目（メイン情報） */
  .train-main {
    background-color: #000000;
    display: flex;
    align-items: center;
    padding: 8px 10px;
  }

  /* 種別エリア */
  .type-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 80px;
    margin-right: 10px;
    flex-shrink: 0;
  }

  .type-badge {
    font-size: 20px;
    font-weight: 900;
    padding: 2px 4px;
    border-radius: 3px;
    text-align: center;
    letter-spacing: 3px;
    text-indent: 3px;
    border: 2px solid #ffffff;
    line-height: 1.2;
    width: 100%;
    box-sizing: border-box;
    color: #ffffff;
  }
  .type-badge.local { background-color: #002b80; }
  .type-badge.express { background-color: #008000; }
  .type-badge.limited { background-color: #cc0000; }

  .type-sub {
    font-size: 10px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 2px;
    letter-spacing: 0.5px;
    font-family: 'Roboto', sans-serif;
  }

  /* 行先エリア */
  .dest-area {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    min-width: 100px;
    margin-right: 5px;
  }
  .dest-main {
    font-size: 24px;
    font-weight: 900;
    white-space: nowrap;
    line-height: 1.1;
  }
  .dest-main.spaced {
    letter-spacing: 3px;
    text-indent: 3px;
  }
  .dest-main.normal {
    letter-spacing: 1px;
    text-indent: 0;
  }

  /* 行先の英字 */
  .dest-sub {
    font-size: 10px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 2px;
    letter-spacing: 0.5px;
    font-family: 'Roboto', sans-serif;
    text-align: left;
  }

  /* 右側グループ */
  .right-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: auto;
  }

  /* 両数・ドア数エリア */
  .specs-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 48px;
    gap: 2px;
    flex-shrink: 0;
  }
  .cars-box {
    background-color: #ffffff;
    color: #000000;
    font-size: 11px;
    font-weight: 900;
    padding: 1px 4px;
    border-radius: 2px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .doors-badge {
    background-color: #cc0000;
    color: #ffffff;
    font-size: 9px;
    font-weight: 900;
    padding: 1px 4px;
    border-radius: 8px;
    white-space: nowrap;
    letter-spacing: 0.5px;
    border: 1px solid #ff4d4d;
  }

  /* 時刻エリア */
  .time-area {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1px;
    font-family: 'Roboto', Arial, sans-serif;
  }

  /* 2行目（お知らせ・接続案内行） */
  .notice-row {
    background: transparent;
    padding: 8px 10px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .notice-line {
    display: flex;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
    line-height: 1.3;
  }

  /* 接続案内バッジ */
  .notice-badge {
    background-color: #ffffff;
    color: #000000;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 20px;
    margin-right: 6px;
    border: 1px solid #cccccc;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .no-trains {
    padding: 20px;
    text-align: center;
    font-size: 15px;
    color: #888;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="wrapper" id="appWrapper">
  <div class="control-panel">
    <label for="fileSelect" style="flex-shrink:0;">ダイヤ:</label>
    <select id="fileSelect">
      <option value="T01_omuta_timetable_weekday.json">T01 福岡(天神) 大牟田 平日</option>
      <option value="T01_omuta_timetable_holiday.json">T01 福岡(天神) 大牟田 休日</option>
    </select>
  </div>

  <div class="monitor-frame">
    <div class="screen" id="train-screen">
      </div>
  </div>
</div>

<script>
  // 画面の向き（縦・横）に合わせて全体のサイズを自動スケールさせる処理
  function adjustScale() {
    const wrapper = document.getElementById('appWrapper');
    const screenWidth = window.innerWidth;
    const targetWidth = 390; // 基準とする幅

    if (screenWidth > targetWidth) {
      // 横画面などで画面幅が広い場合、縮小率を計算してフィットさせる
      const scale = (screenWidth - 20) / targetWidth;
      wrapper.style.transform = `scale(${Math.min(scale, 1.8)})`;
    } else {
      wrapper.style.transform = 'scale(1)';
    }
  }

  window.addEventListener('resize', adjustScale);
  window.addEventListener('orientationchange', adjustScale);
  window.addEventListener('DOMContentLoaded', adjustScale);

  let currentTimetableData = null;

  function getTypeInfo(type) {
    if (type === '特急') return { en: 'Ltd.Exp.', cls: 'limited' };
    if (type === '急行') return { en: 'Express', cls: 'express' };
    return { en: 'Local', cls: 'local' };
  }

  const destEnglish = {
    "筑紫": "Chikushi",
    "大善寺": "Daizenji",
    "花畑": "Hanabatake",
    "大牟田": "Omuta",
    "二日市": "Futsukaichi",
    "小郡": "Ogori",
    "太宰府": "Dazaifu",
    "柳川": "Yanagawa",
    "久留米": "Kurume"
  };

  function formatType(str) {
    if (!str) return '';
    return str.split('').join(' ');
  }

  function formatDestination(str) {
    if (!str) return { text: '', isSpaced: false };
    if (str.length <= 2) {
      return { text: str.split('').join(' '), isSpaced: true };
    }
    return { text: str, isSpaced: false };
  }

  async function loadTimetable(filename) {
    try {
      const response = await fetch(filename);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      currentTimetableData = await response.json();
      updateDisplay();
    } catch (e) {
      console.error('JSON読み込みエラー:', e);
      document.getElementById('train-screen').innerHTML = `<div class="no-trains">データの読み込みに失敗しました<br><small>${filename}</small></div>`;
    }
  }

  function updateDisplay() {
    if (!currentTimetableData || !currentTimetableData.timetable) return;

    const now = new Date();
    const currentHour = now.getHours();
    const currentMinute = now.getMinutes();
    const currentTimeValue = currentHour * 60 + currentMinute;

    let allTrains = [];
    currentTimetableData.timetable.forEach(slot => {
      if (slot.trains) {
        slot.trains.forEach(train => {
          allTrains.push({
            hour: slot.hour,
            minute: train.minute,
            type: train.type,
            destination: train.destination,
            cars: train.cars,
            doors: train.doors,
            note: train.note
          });
        });
      }
    });

    const upcomingTrains = allTrains.filter(train => {
      const trainTimeValue = train.hour * 60 + train.minute;
      return trainTimeValue >= currentTimeValue;
    }).slice(0, 3);

    const screenContainer = document.getElementById('train-screen');
    screenContainer.innerHTML = '';

    if (upcomingTrains.length === 0) {
      screenContainer.innerHTML = '<div class="no-trains">本日の運行は終了しました</div>';
      return;
    }

    upcomingTrains.forEach(train => {
      const typeInfo = getTypeInfo(train.type);
      const timeStr = `${String(train.hour).padStart(2, '0')}:${String(train.minute).padStart(2, '0')}`;
      const destEn = destEnglish[train.destination] || train.destination;

      const formattedType = formatType(train.type);
      const destObj = formatDestination(train.destination);
      const destClass = destObj.isSpaced ? 'dest-main spaced' : 'dest-main normal';

      let noticeHtml = '';
      if (train.note) {
        noticeHtml = `
          <div class="notice-row">
            <div class="notice-line">
              <span class="notice-badge">接続案内</span>
              ${train.note}
            </div>
          </div>
        `;
      }

      const rowHtml = `
        <div class="train-row">
          <div class="train-main">
            <div class="type-area">
              <div class="type-badge ${typeInfo.cls}">${formattedType}</div>
              <div class="type-sub">${typeInfo.en}</div>
            </div>
            <div class="dest-area">
              <div class="${destClass}">${destObj.text}</div>
              <div class="dest-sub">${destEn}</div>
            </div>
            <div class="right-group">
              <div class="specs-area">
                <div class="cars-box">${train.cars}両</div>
                <div class="doors-badge">${train.doors || 3}ドア</div>
              </div>
              <div class="time-area">${timeStr}</div>
            </div>
          </div>
          ${noticeHtml}
        </div>
      `;
      screenContainer.innerHTML += rowHtml;
    });
  }

  const fileSelect = document.getElementById('fileSelect');
  fileSelect.addEventListener('change', (e) => {
    loadTimetable(e.target.value);
  });

  loadTimetable(fileSelect.value);
  setInterval(updateDisplay, 10000);
</script>

</body>
</html>
