<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>西鉄 発車標風ディスプレイ</title>
<style>
  body {
    background-color: #1a1a1a;
    color: #ffffff;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .monitor-frame {
    width: 100%;
    max-width: 560px;
    background-color: #2b2b2b;
    border: 4px solid #444;
    border-radius: 6px;
    padding: 12px;
    box-sizing: border-box;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }

  /* 上部「のりば」表示枠 */
  .platform-header {
    background-color: #1c1c1c;
    border: 2px solid #333;
    padding: 6px 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .platform-num {
    font-size: 24px;
    font-weight: bold;
    line-height: 1;
  }
  .platform-text {
    font-size: 12px;
    color: #bbb;
    letter-spacing: 1px;
  }

  /* 画面本体 */
  .screen {
    border: 2px solid #002b80;
    display: flex;
    flex-direction: column;
  }

  /* 1列分のコンテナ */
  .train-row-container {
    border-bottom: 2px solid #00247d;
    display: flex;
    flex-direction: column;
  }
  .train-row-container:last-child {
    border-bottom: none;
  }

  /* メイン行（1行目：種別・行先・両数・ドア数・時刻） */
  .train-main {
    background-color: #000000;
    display: flex;
    align-items: center;
    padding: 8px 12px;
  }

  /* 種別エリア */
  .type-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-right: 14px;
    min-width: 65px;
  }
  .type-badge {
    font-size: 15px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 3px;
    text-align: center;
    letter-spacing: 1px;
    border: 2px solid #ffffff;
  }
  .type-badge.express { background-color: #2e7d32; color: #ffffff; }
  .type-badge.local   { background-color: #1565c0; color: #ffffff; }
  .type-badge.ltd-exp { background-color: #d32f2f; color: #ffffff; }

  .type-en {
    font-size: 9px;
    color: #e0e0e0;
    margin-top: 1px;
  }

  /* 行先エリア */
  .dest-area {
    display: flex;
    flex-direction: column;
    width: 120px;
    margin-right: 12px;
  }
  .dest-main {
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .dest-en {
    font-size: 10px;
    color: #cccccc;
    margin-top: 0px;
    letter-spacing: 0.5px;
  }

  /* 両数・ドア数エリア */
  .specs-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    min-width: 40px;
  }
  .cars-box {
    background-color: #ffffff;
    color: #000000;
    font-size: 10px;
    font-weight: bold;
    padding: 1px 5px;
    border-radius: 2px;
  }
  .doors-badge {
    background-color: #d32f2f;
    color: #ffffff;
    font-size: 9px;
    font-weight: bold;
    padding: 1px 6px;
    border-radius: 8px;
    white-space: nowrap;
  }

  /* 時刻エリア（両数・ドア数の横に寄せて配置） */
  .time-area {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-left: 20px; /* 両数・ドア数エリアとの間隔 */
    margin-right: auto; /* 右側の余白を逃がす */
  }

  /* 備考・接続案内行（2行目） */
  .notice-row {
    background: linear-gradient(to bottom, #001254 0%, #000824 100%);
    padding: 3px 12px 6px 12px;
    display: flex;
    align-items: center;
    font-size: 10px;
    color: #ffffff;
  }
  .notice-badge {
    background-color: #1565c0;
    color: #ffffff;
    font-size: 8px;
    font-weight: bold;
    padding: 1px 4px;
    border-radius: 2px;
    margin-right: 8px;
    border: 1px solid #42a5f5;
  }
</style>
</head>
<body>

<div class="monitor-frame">
  <!-- のりばヘッダー -->
  <div class="platform-header">
    <span class="platform-num">2</span>
    <span class="platform-text">のりば / Departures</span>
  </div>

  <!-- 画面部分 -->
  <div class="screen">

    <!-- 1本目：普通 筑紫 (7両 3ドア) -->
    <div class="train-row-container">
      <div class="train-main">
        <div class="type-area">
          <div class="type-badge local">普 通</div>
          <div class="type-en">Local</div>
        </div>
        <div class="dest-area">
          <div class="dest-main">筑紫</div>
          <div class="dest-en">Chikushi</div>
        </div>
        <div class="specs-area">
          <div class="cars-box">7 両</div>
          <div class="doors-badge">3ドア</div>
        </div>
        <div class="time-area">10:02</div>
      </div>
      <div class="notice-row">
        <span class="notice-badge">接続案内</span>
        大橋であとの急行が先に発車します
      </div>
    </div>

    <!-- 2本目：普通 大善寺 (4両 3ドア) -->
    <div class="train-row-container">
      <div class="train-main">
        <div class="type-area">
          <div class="type-badge local">普 通</div>
          <div class="type-en">Local</div>
        </div>
        <div class="dest-area">
          <div class="dest-main">大善寺</div>
          <div class="dest-en">Daizenji</div>
        </div>
        <div class="specs-area">
          <div class="cars-box">4 両</div>
          <div class="doors-badge">3ドア</div>
        </div>
        <div class="time-area">10:11</div>
      </div>
      <div class="notice-row">
        <span class="notice-badge">接続案内</span>
        大橋であとの急行が先に発車します
      </div>
    </div>

    <!-- 3本目：普通 筑紫 (4両 4ドア) -->
    <div class="train-row-container">
      <div class="train-main">
        <div class="type-area">
          <div class="type-badge local">普 通</div>
          <div class="type-en">Local</div>
        </div>
        <div class="dest-area">
          <div class="dest-main">筑紫</div>
          <div class="dest-en">Chikushi</div>
        </div>
        <div class="specs-area">
          <div class="cars-box">4 両</div>
          <div class="doors-badge">4ドア</div>
        </div>
        <div class="time-area">10:20</div>
      </div>
      <div class="notice-row">
        <span class="notice-badge">接続案内</span>
        春日原であとの特急に追い越されます
      </div>
    </div>

  </div>
</div>

</body>
</html>
