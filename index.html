<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西鉄電車 発車標レプリカ - iPad mini最適化</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Roboto:wght@700;900&display=swap');

  body {
    background-color: #121212;
    color: #ffffff;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    overflow-x: hidden;
  }

  /* 上部コントロールパネル */
  .control-panel {
    width: 100%;
    max-width: 720px;
    margin-bottom: 15px;
    background: #1a1a1a;
    padding: 10px 15px;
    border-radius: 6px;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 14px;
    box-sizing: border-box;
  }
  .control-panel select {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    padding: 5px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
  }

  /* iPad miniの画面横幅にジャストフィットさせる外枠 */
  .monitor-frame {
    width: 100%;
    max-width: 720px;
    background-color: #080808;
    border: 6px solid #1a1a1a;
    border-radius: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,0,0,0.9);
    overflow: hidden;
    box-sizing: border-box;
  }

  /* 画面ディスプレイ部分 */
  .screen {
    background: linear-gradient(to bottom, #001254 0%, #000a33 45%, #000312 80%, #000000 100%);
    display: flex;
    flex-direction: column;
    border: 2px solid #001a66;
  }

  /* 1列車分のブロック */
  .train-row {
    border-bottom: 2px solid #001855;
    display: flex;
    flex-direction: column;
  }
  .train-row:last-child {
    border-bottom: none;
  }

  /* 1行目（メイン情報） */
  .train-main {
    background-color: #000000;
    display: flex;
    align-items: center;
    padding: 10px 16px;
  }

  /* 種別エリア */
  .type-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 110px;
    margin-right: 30px;
    flex-shrink: 0;
  }

  .type-badge {
    font-size: 26px;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 3px;
    text-align: center;
    letter-spacing: 6px;
    text-indent: 6px;
    border: 2px solid #ffffff;
    line-height: 1.2;
    width: 100%;
    box-sizing: border-box;
    color: #ffffff;
  }
  .type-badge.local { background-color: #002b80; }
  .type-badge.express { background-color: #008000; }
  .type-badge.limited { background-color: #cc0000; }

  .type-sub {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 2px;
    letter-spacing: 0.5px;
    font-family: 'Roboto', sans-serif;
  }

  /* 行先エリア（幅を狭く調整） */
  .dest-area {
    display: flex;
    flex-direction: column;
    flex-grow: 0; /* 広がりすぎないように変更 */
    min-width: 150px; /* 最低限の幅を確保 */
    margin-right: auto; /* 余白を右側に逃がす */
  }
  .dest-main {
    font-size: 34px;
    font-weight: 900;
    white-space: nowrap;
    line-height: 1.1;
  }
  .dest-main.spaced {
    letter-spacing: 6px;
    text-indent: 6px;
  }
  .dest-main.normal {
    letter-spacing: 1px;
    text-indent: 0;
  }

  /* 行先の英字（左寄せに戻す） */
  .dest-sub {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 2px;
    letter-spacing: 0.5px;
    font-family: 'Roboto', sans-serif;
    text-align: left;
  }

  /* 右側グループ */
  .right-group {
    display: flex;
    align-items: center;
    gap: 22px;
    flex-shrink: 0;
    margin-left: 8px;
  }

  /* 両数・ドア数エリア */
  .specs-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 52px;
    gap: 3px;
    flex-shrink: 0;
  }
  .cars-box {
    background-color: #ffffff;
    color: #000000;
    font-size: 13px;
    font-weight: 900;
    padding: 1px 6px;
    border-radius: 2px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .doors-badge {
    background-color: #cc0000;
    color: #ffffff;
    font-size: 11px;
    font-weight: 900;
    padding: 1px 6px;
    border-radius: 10px;
    white-space: nowrap;
    letter-spacing: 0.5px;
    border: 1px solid #ff4d4d;
  }

  /* 時刻エリア */
  .time-area {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 1.5px;
    font-family: 'Roboto', Arial, sans-serif;
  }

  /* 2行目（お知らせ・接続案内行） */
  .notice-row {
    background: transparent;
    padding: 12px 16px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .notice-line {
    display: flex;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
    line-height: 1.4;
  }

  /* 接続案内バッジ（白背景・黒文字・楕円囲み） */
  .notice-badge {
    background-color: #ffffff;
    color: #000000;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    margin-right: 10px;
    border: 1px solid #cccccc;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .no-trains {
    padding: 30px;
    text-align: center;
    font-size: 18px;
    color: #888;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="control-panel">
  <label for="fileSelect">ダイヤ選択:</label>
  <select id="fileSelect">
    <option value="T01_omuta_timetable_weekday.json">T01 福岡(天神) 大牟田方面 平日</option>
    <option value="T01_omuta_timetable_holiday.json">T01 福岡(天神) 大牟田方面 休日</option>
  </select>
</div>

<div class="monitor-frame">
  <div class="screen" id="train-screen">
    </div>
</div>

<script>
  let currentTimetableData = null;

  function getTypeInfo(type) {
    if (type === '特急') return { en: 'Ltd.Exp.', cls: 'limited' };
    if (type === '急行') return { en: 'Express', cls: 'express' };
    return { en: 'Local', cls: 'local' };
  }

  const destEnglish = {
    "筑紫": "Chikushi",
    "大善寺": "Daizenji",
    "花畑": "Hanabatake",
    "大牟田": "Omuta",
    "二日市": "Futsukaichi",
    "小郡": "Ogori",
    "太宰府": "Dazaifu",
    "柳川": "Yanagawa",
    "久留米": "Kurume"
  };

  function formatType(str) {
    if (!str) return '';
    return str.split('').join(' ');
  }

  function formatDestination(str) {
    if (!str) return { text: '', isSpaced: false };
    if (str.length <= 2) {
      return { text: str.split('').join(' '), isSpaced: true };
    }
    return { text: str, isSpaced: false };
  }

  async function loadTimetable(filename) {
    try {
      const response = await fetch(filename);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      currentTimetableData = await response.json();
      updateDisplay();
    } catch (e) {
      console.error('JSON読み込みエラー:', e);
      document.getElementById('train-screen').innerHTML = `<div class="no-trains">データの読み込みに失敗しました<br><small>${filename}</small></div>`;
    }
  }

  function updateDisplay() {
    if (!currentTimetableData || !currentTimetableData.timetable) return;

    const now = new Date();
    const currentHour = now.getHours();
    const currentMinute = now.getMinutes();
    const currentTimeValue = currentHour * 60 + currentMinute;

    let allTrains = [];
    currentTimetableData.timetable.forEach(slot => {
      if (slot.trains) {
        slot.trains.forEach(train => {
          allTrains.push({
            hour: slot.hour,
            minute: train.minute,
            type: train.type,
            destination: train.destination,
            cars: train.cars,
            doors: train.doors,
            note: train.note
          });
        });
      }
    });

    const upcomingTrains = allTrains.filter(train => {
      const trainTimeValue = train.hour * 60 + train.minute;
      return trainTimeValue >= currentTimeValue;
    }).slice(0, 3);

    const screenContainer = document.getElementById('train-screen');
    screenContainer.innerHTML = '';

    if (upcomingTrains.length === 0) {
      screenContainer.innerHTML = '<div class="no-trains">本日の運行は終了しました</div>';
      return;
    }

    upcomingTrains.forEach(train => {
      const typeInfo = getTypeInfo(train.type);
      const timeStr = `${String(train.hour).padStart(2, '0')}:${String(train.minute).padStart(2, '0')}`;
      const destEn = destEnglish[train.destination] || train.destination;

      const formattedType = formatType(train.type);
      const destObj = formatDestination(train.destination);
      const destClass = destObj.isSpaced ? 'dest-main spaced' : 'dest-main normal';

      let noticeHtml = '';
      if (train.note) {
        noticeHtml = `
          <div class="notice-row">
            <div class="notice-line">
              <span class="notice-badge">接続案内</span>
              ${train.note}
            </div>
          </div>
        `;
      }

      const rowHtml = `
        <div class="train-row">
          <div class="train-main">
            <div class="type-area">
              <div class="type-badge ${typeInfo.cls}">${formattedType}</div>
              <div class="type-sub">${typeInfo.en}</div>
            </div>
            <div class="dest-area">
              <div class="${destClass}">${destObj.text}</div>
              <div class="dest-sub">${destEn}</div>
            </div>
            <div class="right-group">
              <div class="specs-area">
                <div class="cars-box">${train.cars} 両</div>
                <div class="doors-badge">${train.doors || 3}ドア</div>
              </div>
              <div class="time-area">${timeStr}</div>
            </div>
          </div>
          ${noticeHtml}
        </div>
      `;
      screenContainer.innerHTML += rowHtml;
    });
  }

  const fileSelect = document.getElementById('fileSelect');
  fileSelect.addEventListener('change', (e) => {
    loadTimetable(e.target.value);
  });

  loadTimetable(fileSelect.value);
  setInterval(updateDisplay, 10000);
</script>

</body>
</html>
