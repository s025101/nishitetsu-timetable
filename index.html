<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>西鉄福岡(天神) 発車標</title>
<style>
  body {
    background-color: #0b1d3a;
    color: #ffffff;
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
  }
  .container {
    width: 900px;
    background-color: #000000;
    border: 2px solid #222;
    padding: 10px;
  }
  /* コントロールヘッダー */
  .control-header {
    display: flex;
    justify-content: space-between;
    background-color: #111;
    padding: 10px;
    border: 1px solid #333;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .control-header select {
    background-color: #222;
    color: #fff;
    border: 1px solid #555;
    padding: 4px 8px;
    font-size: 14px;
  }
  /* 方面タイトル */
  .direction-title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    padding: 10px 0;
    border-bottom: 2px solid #222;
    margin-bottom: 5px;
  }
  .direction-subtitle {
    font-size: 12px;
    color: #aaa;
    text-align: center;
    font-weight: normal;
  }
  /* 列車行（1行分） */
  .train-item {
    border-bottom: 2px solid #162c50;
  }
  /* 1行目：黒背景 */
  .train-row {
    display: flex;
    align-items: center;
    background-color: #000000;
    padding: 14px 20px;
  }
  /* 種別エリア */
  .type-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-right: 30px;
    min-width: 100px;
  }
  .type-badge {
    font-size: 26px;
    font-weight: bold;
    padding: 4px 16px;
    border-radius: 4px;
    text-align: center;
    letter-spacing: 2px;
    border: 2px solid #ffffff;
  }
  /* 種別ごとの色（普通は青、急行は緑、特急は赤） */
  .type-badge.express { background-color: #2e7d32; color: #ffffff; }
  .type-badge.local   { background-color: #1565c0; color: #ffffff; }
  .type-badge.ltd-exp { background-color: #d32f2f; color: #ffffff; }

  .type-en {
    font-size: 14px;
    color: #ffffff;
    margin-top: 4px;
    letter-spacing: 1px;
  }
  /* 行先エリア */
  .dest-area {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }
  .dest-main {
    font-size: 38px;
    font-weight: bold;
    width: 280px;
    white-space: nowrap;
  }
  /* 2文字の場合、3文字分の幅いっぱいに文字間を広げる */
  .dest-main.two-chars {
    display: flex;
    justify-content: space-between;
  }
  .dest-en {
    font-size: 16px;
    color: #cccccc;
    margin-top: 2px;
    letter-spacing: 1px;
  }
  /* 両数・ドア数エリア */
  .specs-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-right: 40px;
    gap: 6px;
  }
  .cars-box {
    background-color: #ffffff;
    color: #000000;
    font-size: 16px;
    font-weight: bold;
    padding: 2px 10px;
    border-radius: 2px;
    border: 1px solid #999;
  }
  .doors-badge {
    background-color: #d32f2f;
    color: #ffffff;
    font-size: 13px;
    font-weight: bold;
    padding: 2px 12px;
    border-radius: 20px;
    text-align: center;
    white-space: nowrap;
  }
  /* 時刻エリア */
  .time-area {
    font-size: 46px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  /* 2行目：黒から青へのグラデーション背景 */
  .notice-row {
    background: linear-gradient(to bottom, #000000, #0a2347);
    color: #ffffff;
    font-size: 13px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    box-sizing: border-box;
    border-top: 1px solid #112544;
  }
  .notice-badge {
    background-color: #1976d2;
    color: #ffffff;
    font-size: 11px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 12px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 上部コントロール -->
  <div class="control-header">
    <div>駅: <select><option>T01: 西鉄福岡(天神)</option></select></div>
    <div>方面: <select><option>大牟田 方面</option></select></div>
  </div>

  <!-- 方面ヘッダー -->
  <div class="direction-title">
    大牟田方面<br>
    <span class="direction-subtitle">Omuta</span>
  </div>

  <!-- 1本目：急行 花畑 (2文字・文字間を広げる) -->
  <div class="train-item">
    <div class="train-row">
      <div class="type-area">
        <div class="type-badge express">急 行</div>
        <div class="type-en">Express</div>
      </div>
      <div class="dest-area">
        <div class="dest-main two-chars"><span>花</span><span>畑</span></div>
        <div class="dest-en">Hanabatake</div>
      </div>
      <div class="specs-area">
        <div class="cars-box">6 両</div>
        <div class="doors-badge">3ドア</div>
      </div>
      <div class="time-area">15:36</div>
    </div>
    <div class="notice-row">
      <span class="notice-badge">接続案内</span>
      花畑で下り普通に接続します
    </div>
  </div>

  <!-- 2本目：普通 大善寺 (3文字) -->
  <div class="train-item">
    <div class="train-row">
      <div class="type-area">
        <div class="type-badge local">普 通</div>
        <div class="type-en">Local</div>
      </div>
      <div class="dest-area">
        <div class="dest-main">大善寺</div>
        <div class="dest-en">Daizenji</div>
      </div>
      <div class="specs-area">
        <div class="cars-box">5 両</div>
        <div class="doors-badge">3ドア</div>
      </div>
      <div class="time-area">15:53</div>
    </div>
  </div>

  <!-- 3本目：特急 大牟田 (3文字) -->
  <div class="train-item">
    <div class="train-row">
      <div class="type-area">
        <div class="type-badge ltd-exp">特 急</div>
        <div class="type-en">Ltd.Exp</div>
      </div>
      <div class="dest-area">
        <div class="dest-main">大牟田</div>
        <div class="dest-en">Ōmuta</div>
      </div>
      <div class="specs-area">
        <div class="cars-box">7 両</div>
        <div class="doors-badge">3ドア</div>
      </div>
      <div class="time-area">16:00</div>
    </div>
    <div class="notice-row">
      <span class="notice-badge">接続案内</span>
      二日市、久留米、大善寺、柳川で普通電車に接続します
    </div>
  </div>

</div>

</body>
</html>
