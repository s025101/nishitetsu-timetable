<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>西鉄電車 発車案内ディスプレイ</title>
    <style>
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: "MS Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-board {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border: 4px solid #1a1a1a;
            background-color: #000000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .board-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background-color: #000000;
            padding: 8px 15px;
            border-bottom: 3px solid #333;
        }

        .station-select {
            background-color: #111;
            color: #fff;
            border: 1px solid #666;
            font-size: 15pt;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* 列車行コンテナ */
        .train-block {
            border-bottom: 3px solid #222;
        }

        /* 上下2段構成のメイン行 */
        .train-row {
            display: grid;
            grid-template-columns: 145px 1fr auto;
            align-items: center;
            background: linear-gradient(to bottom, #001133 0%, #000822 100%);
            padding: 12px 15px;
            border-top: 2px solid #002266;
            gap: 15px;
        }

        /* 1列目：種別エリア（上下2段） */
        .type-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 4px;
        }

        .train-type {
            font-size: 26pt;
            font-weight: bold;
            padding: 1px 2px 1px 8px;
            text-align: center;
            border: 2px solid #ffffff;
            border-radius: 4px;
            width: 115px;
            letter-spacing: 12px;
        }

        .type-limited { background-color: #e60012; color: #ffffff; } /* 赤：特急 */
        .type-express { background-color: #009944; color: #ffffff; } /* 緑：急行 */
        .type-local   { background-color: #0044cc; color: #ffffff; } /* 青：普通 */

        .sub-type {
            font-size: 14pt;
            color: #ffffff;
            font-family: sans-serif;
            letter-spacing: 1px;
            margin-left: 2px;
        }

        /* 2列目：行先エリア（上下2段） */
        .destination-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        .destination {
            font-size: 32pt;
            font-weight: bold;
            letter-spacing: 12px;
            margin-left: 6px;
            white-space: nowrap;
        }

        /* 2文字の駅名（柳川、花畑など）専用の文字間隔調整 */
        .destination.len-2 {
            letter-spacing: 42px;
            margin-right: -42px;
        }

        .sub-destination {
            font-size: 15pt;
            color: #aaaaaa;
            font-family: sans-serif;
            letter-spacing: 1px;
            margin-left: 4px;
        }

        /* 3列目：時刻・のりば・両数・ドア数エリア */
        .info-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* 上段（時刻＋のりば） */
        .time-platform-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
        }

        .time-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time {
            font-size: 34pt;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
        }

        /* のりば番号バッジ（青背景に白文字の角丸四角） */
        .platform-badge {
            background-color: #0044cc;
            color: #ffffff;
            font-size: 11pt;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #6699ff;
            text-align: center;
            line-height: 1.1;
        }

        /* 下段（両数＋ドア数） */
        .details-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .cars-text {
            font-size: 15pt;
            color: #ffffff;
            font-family: sans-serif;
        }

        /* ドア数バッジ（赤の楕円ピル型枠） */
        .door-badge {
            background-color: #e60012;
            color: #ffffff;
            font-size: 12pt;
            font-weight: bold;
            padding: 1px 8px;
            border-radius: 10px;
            border: 1px solid #ff6666;
            text-align: center;
            white-space: nowrap;
        }

        /* 案内メッセージ帯（接続・追越など） */
        .notice-row {
            background-color: #000000;
            border-top: 1px solid #333333;
            padding: 6px 15px;
            font-size: 14pt;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notice-badge {
            background-color: #222222;
            border: 1px solid #777777;
            border-radius: 12px;
            padding: 2px 12px;
            font-size: 12pt;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
        }

        .error-message {
            color: #ff3333;
            text-align: center;
            font-size: 18pt;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="main-board">
        <div class="board-header">
            <div>
                <select id="stationSelect" class="station-select">
                    <option value="T01">T01: 西鉄福岡（天神）</option>
                </select>
            </div>
        </div>

        <div id="boardContent">
            <!-- データがここに読み込まれます -->
        </div>
    </div>

    <script>
        async function loadTimetable() {
            try {
                const today = new Date();
                const dayOfWeek = today.getDay();
                const isHoliday = (dayOfWeek === 0 || dayOfWeek === 6);
                const jsonFileName = isHoliday ? "T01_timetable_holiday.json" : "T01_timetable_weekday.json";

                const response = await fetch(jsonFileName);
                if (!response.ok) throw new Error("ファイルが見つかりません");
                
                const data = await response.json();
                renderBoard(data);
            } catch (error) {
                console.error(error);
                document.getElementById('boardContent').innerHTML = `
                    <div class="error-message">時刻表データの読み込みエラー</div>
                `;
            }
        }

        function renderBoard(data) {
            const container = document.getElementById('boardContent');
            let html = '';

            if (data.trains && data.trains.length > 0) {
                const now = new Date();
                const currentMinutes = now.getHours() * 60 + now.getMinutes();

                let upcomingTrains = data.trains.filter(train => {
                    const parts = train.time.split(':');
                    if (parts.length !== 2) return false;
                    const trainMinutes = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                    return trainMinutes >= currentMinutes;
                });

                if (upcomingTrains.length === 0) {
                    upcomingTrains = data.trains;
                }

                const targetTrains = upcomingTrains.slice(0, 3);

                targetTrains.forEach(train => {
                    let typeClass = 'type-local';
                    if (train.type === '特急') typeClass = 'type-limited';
                    else if (train.type === '急行') typeClass = 'type-express';

                    // 「西鉄柳川」を「柳川」に置き換え
                    let dest = train.destination;
                    if (dest && dest.includes("西鉄柳川")) {
                        dest = "柳川";
                    }

                    // 2文字の駅名の場合は専用クラス（len-2）を付与
                    const lenClass = (dest && dest.length === 2) ? 'len-2' : '';

                    html += `
                        <div class="train-block">
                            <div class="train-row">
                                <!-- 種別エリア（上：日本語、下：英語） -->
                                <div class="type-area">
                                    <div class="train-type ${typeClass}">${train.type}</div>
                                    <div class="sub-type">${train.subType || ''}</div>
                                </div>

                                <!-- 行先エリア（上：日本語、下：ローマ字） -->
                                <div class="destination-area">
                                    <div class="destination ${lenClass}">${dest}</div>
                                    <div class="sub-destination">${train.subDestination || ''}</div>
                                </div>

                                <!-- 右側情報エリア -->
                                <div class="info-area">
                                    <div class="time-platform-group">
                                        <div class="time-row">
                                            <div class="time">${train.time}</div>
                                            ${train.platform ? `<div class="platform-badge">${train.platform}のりば</div>` : ''}
                                        </div>
                                        <div class="details-row">
                                            <div class="cars-text">${train.cars || ''}</div>
                                            ${train.doors ? `<div class="door-badge">${train.doors}</div>` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>
                    `;

                    if (train.notice) {
                        html += `
                            <div class="notice-row">
                                <span class="notice-badge">${train.noticeType || '案内'}</span>
                                <span>${train.notice}</span>
                            </div>
                        `;
                    }

                    html += `</div>`;
                });
            } else {
                html = '<div class="error-message">本日のダイヤはありません</div>';
            }

            container.innerHTML = html;
        }

        window.onload = loadTimetable;
    </script>
</body>
</html>
