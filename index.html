<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>西鉄福岡(天神) 発車標</title>
<style>
  body {
    background-color: #0b1d3a;
    color: #ffffff;
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
  }
  .board {
    width: 800px;
    background-color: #050d1a;
    border: 2px solid #2e4a7d;
    padding: 10px;
  }
  .train-row {
    display: flex;
    align-items: center;
    background: linear-gradient(to bottom, #0d2347, #061226);
    border-bottom: 2px solid #1a365d;
    padding: 10px 15px;
    position: relative;
  }
  /* 種別バッジ */
  .type-badge {
    background-color: #d32f2f; /* 特急は赤、急行は緑などに調整可 */
    color: #ffffff;
    font-size: 24px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 4px;
    text-align: center;
    min-width: 90px;
    margin-right: 20px;
  }
  .type-badge.express {
    background-color: #2e7d32; /* 急行用 */
  }
  /* 行先 */
  .destination {
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 4px;
    flex-grow: 1;
  }
  /* 両数・ドア数エリア */
  .specs {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-right: 30px;
    gap: 4px;
  }
  .cars-box {
    background-color: #ffffff;
    color: #000000;
    font-size: 18px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 2px;
    border: 1px solid #ccc;
  }
  .doors-badge {
    background-color: #d32f2f;
    color: #ffffff;
    font-size: 14px;
    font-weight: bold;
    padding: 2px 10px;
    border-radius: 20px; /* 楕円囲み */
    text-align: center;
  }
  /* 発車時刻 */
  .time {
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-right: 20px;
  }
  /* のりば */
  .platform {
    background-color: #ffffff;
    color: #000000;
    font-size: 24px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 4px;
  }
  /* 下段：接続案内（備考） */
  .notice-row {
    background-color: #091933;
    color: #ffffff;
    font-size: 14px;
    padding: 6px 15px 8px 15px;
    border-bottom: 3px solid #1a365d;
    display: flex;
    align-items: center;
  }
  .notice-badge {
    background-color: #1565c0;
    color: #ffffff;
    font-size: 12px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 10px;
  }
</style>
</head>
<body>

<div class="board">
  <!-- 1本目：特急 大牟田 -->
  <div class="train-row">
    <div class="type-badge">特 急</div>
    <div class="destination">大牟田</div>
    <div class="specs">
      <div class="cars-box">6 両</div>
      <div class="doors-badge">3ドア</div>
    </div>
    <div class="time">10:30</div>
    <div class="platform">3 <span style="font-size:12px;">のりば</span></div>
  </div>
  <div class="notice-row">
    <span class="notice-badge">接続案内</span>
    二日市、久留米、大善寺、柳川で普通電車に接続します
  </div>

  <!-- 2本目：急行 花畑 -->
  <div class="train-row">
    <div class="type-badge express">急 行</div>
    <div class="destination">花 畑</div>
    <div class="specs">
      <div class="cars-box">5 両</div>
      <div class="doors-badge">3ドア</div>
    </div>
    <div class="time">10:38</div>
    <div class="platform">1 <span style="font-size:12px;">のりば</span></div>
  </div>
  <div class="notice-row">
    <span class="notice-badge">接続案内</span>
    大橋、二日市、小郡、花畑で普通電車に接続します
  </div>
</div>

</body>
</html>
