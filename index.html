<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>西鉄電車 駅時刻表</title>
    <!-- スタイルシートの記述は省略・お好みで -->
</head>
<body>

    <div class="card">
        <h1 id="station-info">読み込み中...</h1>
        <div class="clock" id="clock">--:--:--</div>
        
        <!-- 切り替えボタンなどの例 -->
        <div style="margin-top: 10px;">
            <select id="jsonSelector">
                <option value="T11_fukuoka_timetable_weekday.json">天神駅発 平日</option>
                <option value="T11_fukuoka_timetable_holiday.json">天神駅発 休日</option>
                <!-- 必要に応じて他のファイルも選択肢に追加できます -->
            </select>
        </div>
    </div>

    <div class="card">
        <h2>直近の発車予定</h2>
        <ul class="train-list" id="train-list"></ul>
    </div>

    <script>
        let timetableData = null;

        async function loadTimetable(filename) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('ファイルの読み込みに失敗しました');
                timetableData = await response.json();

                document.getElementById('station-info').innerText = 
                    `${timetableData.station} (${timetableData.direction})`;
                updateTimetable();
            } catch (error) {
                console.error(error);
                document.getElementById('station-info').innerText = '読み込みエラー';
            }
        }

        function updateTimetable() {
            if (!timetableData) return;
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();

            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];

            let allTrains = [];
            timetableData.timetable.forEach(slot => {
                slot.trains.forEach(train => {
                    allTrains.push({ hour: slot.hour, ...train });
                });
            });

            const currentTimeValue = currentHour * 60 + currentMinute;
            const upcoming = allTrains.filter(t => (t.hour * 60 + t.minute) >= currentTimeValue).slice(0, 5);

            const list = document.getElementById('train-list');
            list.innerHTML = '';
            
            if (upcoming.length === 0) {
                list.innerHTML = '<li>本日の運行は終了しました</li>';
                return;
            }

            upcoming.forEach(train => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${String(train.hour).padStart(2, '0')}:${String(train.minute).padStart(2, '0')}</strong> [${train.type}] ${train.destination}行 (${train.cars}両)`;
                list.appendChild(li);
            });
        }

        // セレクトボックスでファイルが変更されたら再読み込み
        const selector = document.getElementById('jsonSelector');
        selector.addEventListener('change', (e) => {
            loadTimetable(e.target.value);
        });

        // 初期読み込み（最初はセレクトボックスの選択値を使用）
        loadTimetable(selector.value);
        setInterval(updateTimetable, 1000);
    </script>
</body>
</html>
