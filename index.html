<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>西鉄電車 発車案内ディスプレイ</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "MS Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .main-board {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border: 3px solid #111;
            background-color: #000000;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000000;
            padding: 10px 20px;
            border-bottom: 2px solid #333;
        }

        .board-title {
            font-size: 24pt;
            font-weight: bold;
            color: #00bbff;
            letter-spacing: 2px;
        }

        .station-select {
            background-color: #222;
            color: #fff;
            border: 1px solid #555;
            font-size: 14pt;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* 列車行（1列車分） */
        .train-row {
            display: grid;
            grid-template-columns: 1fr auto;
            border-top: 3px solid #444;
            background-color: #000000;
            padding: 12px 20px;
            align-items: center;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .type-dest-line {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 4px;
        }

        /* 列車種別のスタイル（指定の配色＋白枠） */
        .train-type {
            font-size: 22pt;
            font-weight: bold;
            padding: 2px 10px;
            text-align: center;
            border: 2px solid #ffffff; /* 白枠 */
            border-radius: 4px;
            min-width: 90px;
        }

        /* 特急：赤背景 */
        .type-limited {
            background-color: #ff0000;
            color: #ffffff;
        }

        /* 急行：緑背景 */
        .type-express {
            background-color: #00aa00;
            color: #ffffff;
        }

        /* 普通：青背景 */
        .type-local {
            background-color: #0000ff;
            color: #ffffff;
        }

        .destination {
            font-size: 28pt;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .sub-dest {
            font-size: 16pt;
            color: #bbb;
            margin-left: 115px; /* 種別＋隙間分をオフセット */
        }

        .right-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
        }

        .time-platform-line {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 4px;
        }

        .time {
            font-size: 28pt;
            font-weight: bold;
            font-family: monospace;
        }

        .platform-badge {
            background-color: #0044cc;
            color: #ffffff;
            font-size: 16pt;
            font-weight: bold;
            padding: 2px 12px;
            border-radius: 4px;
            border: 1px solid #6699ff;
            text-align: center;
        }

        .cars {
            font-size: 16pt;
            color: #bbb;
            text-align: right;
        }

        /* 案内メッセージ部分（接続・追越・お知らせなど） */
        .notice-row {
            background-color: #111;
            border-top: 1px solid #444;
            padding: 8px 15px;
            font-size: 14pt;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notice-badge {
            background-color: #333;
            border: 1px solid #777;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12pt;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
        }

        .error-message {
            color: #ff3333;
            text-align: center;
            font-size: 18pt;
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="main-board">
        <div class="board-header">
            <div class="board-title">発車案内</div>
            <div>
                <select id="stationSelect" class="station-select" onchange="changeStation()">
                    <option value="T01">T01: 西鉄福岡（天神）</option>
                </select>
            </div>
        </div>

        <div id="boardContent">
            <!-- ここに時刻表データが動的に挿入されます -->
        </div>
    </div>

    <script>
        // 本日の曜日からJSONファイルを自動判別して読み込むロジックなどの既存スクリプトをここに記述
        async function loadTimetable() {
            try {
                // 土日祝日の判定（例として簡易的に実装、必要に応じてお手元のスクリプトに合わせてね）
                const today = new Date();
                const dayOfWeek = today.getDay(); // 0:日曜, 6:土曜
                const isHoliday = (dayOfWeek === 0 || dayOfWeek === 6);
                
                const jsonFileName = isHoliday ? "T01_timetable_holiday.json" : "T01_timetable_weekday.json";

                const response = await fetch(jsonFileName);
                if (!response.ok) {
                    throw new Error("ファイルが見つかりません");
                }
                const data = await response.json();
                renderBoard(data);
            } catch (error) {
                console.error(error);
                document.getElementById('boardContent').innerHTML = `
                    <div class="error-message">時刻表データの読み込みエラー</div>
                `;
            }
        }

        function renderBoard(data) {
            const container = document.getElementById('boardContent');
            let html = '';

            // データ構造に合わせて描画するループ処理
            // ※お手元のデータ構造に合わせて調整してください
            if (data.trains && data.trains.length > 0) {
                data.trains.forEach(train => {
                    // 種別に応じたCSSクラスの割り当て
                    let typeClass = 'type-local';
                    if (train.type === '特急') typeClass = 'type-limited';
                    else if (train.type === '急行') typeClass = 'type-express';

                    html += `
                        <div class="train-row">
                            <div class="left-section">
                                <div class="type-dest-line">
                                    <div class="train-type ${typeClass}">${train.type}</div>
                                    <div class="destination">${train.destination}</div>
                                </div>
                                <div class="sub-dest">${train.subDestination || ''}</div>
                            </div>
                            <div class="right-section">
                                <div class="time-platform-line">
                                    <div class="time">${train.time}</div>
                                    <div class="platform-badge">${train.platform}番のりば</div>
                                </div>
                                <div class="cars">${train.cars || ''}</div>
                            </div>
                        </div>
                    `;

                    // 案内メッセージがある場合
                    if (train.notice) {
                        html += `
                            <div class="notice-row">
                                <span class="notice-badge">${train.noticeType || '案内'}</span>
                                <span>${train.notice}</span>
                            </div>
                        `;
                    }
                });
            } else {
                html = '<div class="error-message">本日のダイヤはありません</div>';
            }

            container.innerHTML = html;
        }

        // ページ読み込み時に実行
        window.onload = loadTimetable;
    </script>
</body>
</html>
