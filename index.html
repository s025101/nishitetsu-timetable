<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西鉄発車案内</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Roboto:wght@700;900&display=swap');

  body {
    background-color: #0b0f19;
    color: #ffffff;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    overflow-x: hidden;
  }

  /* 上部コントロールパネルとモニターの共通ラッパー */
  .wrapper {
    width: 420px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transform-origin: top center;
    transition: transform 0.2s ease;
  }

  /* 上部コントロールパネル */
  .control-panel {
    width: 100%;
    background: #1a1a1a;
    padding: 8px 12px;
    border-radius: 6px;
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 13px;
    box-sizing: border-box;
  }
  .control-panel select {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    width: 100%;
  }

  /* モニターフレーム */
  .monitor-frame {
    width: 100%;
    background-color: #000000;
    border: 4px solid #1e40af;
    border-radius: 8px;
    box-shadow: 0 0 25px rgba(30, 64, 175, 0.6), inset 0 0 10px rgba(0,0,0,0.9);
    overflow: hidden;
    box-sizing: border-box;
  }

  /* 画面上部の「Departures」ヘッダー */
  .monitor-header {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 8px 0 4px 0;
    background: #000000;
    border-bottom: 2px solid #1e40af;
    font-family: 'Roboto', sans-serif;
  }

  /* 画面ディスプレイ部分 */
  .screen {
    background: #000000;
    display: flex;
    flex-direction: column;
  }

  /* 1列車分のブロック（上：黒、下に向かって青くなるグラデーション） */
  .train-row {
    background: linear-gradient(to bottom, #000000 0%, #000a33 60%, #1e3a8a 100%);
    border-bottom: 2px solid #1e40af;
    display: flex;
    flex-direction: column;
    padding: 10px 12px;
  }
  .train-row:last-child {
    border-bottom: none;
  }

  /* 1行目（メイン情報） */
  .train-main {
    display: flex;
    align-items: center;
  }

  /* 種別エリア */
  .type-area {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 90px;
    margin-right: 15px;
    flex-shrink: 0;
  }

  .type-badge {
    font-size: 24px;
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 4px;
    text-align: center;
    letter-spacing: 4px;
    line-height: 1.2;
    width: 100%;
    box-sizing: border-box;
    color: #ffffff;
  }
  .type-badge.local { 
    background-color: #002b80; 
    border: 2px solid #93c5fd;
  }
  .type-badge.express { 
    background-color: #047857; 
    border: 2px solid #a7f3d0;
  }
  .type-badge.limited { 
    background-color: #be123c; 
    border: 2px solid #fecdd3;
  }

  .type-sub {
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 3px;
    letter-spacing: 0.5px;
    font-family: 'Roboto', sans-serif;
  }

  /* 行先エリア */
  .dest-area {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    justify-content: center;
  }
  .dest-main {
    font-size: 32px;
    font-weight: 900;
    white-space: nowrap;
    line-height: 1.1;
  }
  .dest-main.spaced {
    letter-spacing: 6px;
  }
  .dest-main.normal {
    letter-spacing: 2px;
  }

  /* 行先の英字 */
  .dest-sub {
    font-size: 11px;
    font-weight: 700;
    color: #e2e8f0;
    margin-top: 3px;
    letter-spacing: 0.5px;
    font-family: 'Roboto', sans-serif;
  }

  /* 右側グループ（両数・ドア・時刻） */
  .right-group {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-shrink: 0;
    margin-left: auto;
  }

  /* 両数・ドア数エリア */
  .specs-area {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }
  .cars-box {
    background-color: #ffffff;
    color: #000000;
    font-size: 14px;
    font-weight: 900;
    padding: 1px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .doors-badge {
    background-color: #e11d48;
    color: #ffffff;
    font-size: 11px;
    font-weight: 900;
    padding: 1px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }

  /* 時刻エリア */
  .time-area {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 1px;
    font-family: 'Roboto', Arial, sans-serif;
    width: 120px;
    text-align: right;
  }

  /* 2行目（お知らせ・接続案内行） */
  .notice-row {
    background: transparent;
    padding-top: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .notice-line {
    display: flex;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
  }

  /* 接続案内バッジ */
  .notice-badge {
    background-color: #ffffff;
    color: #000000;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 12px;
    border: 1px solid #cccccc;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .no-trains {
    padding: 20px;
    text-align: center;
    font-size: 15px;
    color: #888;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="wrapper" id="appWrapper">
  <div class="control-panel">
    <label for="fileSelect" style="flex-shrink:0;">ダイヤ:</label>
    <select id="fileSelect">
      <option value="T01_omuta_timetable_weekday.json">T01 福岡(天神) 大牟田 平日</option>
      <option value="T01_omuta_timetable_holiday.json">T01 福岡(天神) 大牟田 休日</option>
    </select>
  </div>

  <div class="monitor-frame">
    <div class="monitor-header">Departures</div>
    <div class="screen" id="train-screen">
      <!-- 動的生成 -->
    </div>
  </div>
</div>

<script>
  function adjustScale() {
    const wrapper = document.getElementById('appWrapper');
    const screenWidth = window.innerWidth;
    const targetWidth = 440;

    if (screenWidth < targetWidth) {
      const scale = (screenWidth - 20) / targetWidth;
      wrapper.style.transform = `scale(${Math.max(scale, 0.6)})`;
    } else {
      wrapper.style.transform = 'scale(1)';
    }
  }

  window.addEventListener('resize', adjustScale);
  window.addEventListener('orientationchange', adjustScale);
  window.addEventListener('DOMContentLoaded', adjustScale);

  let currentTimetableData = null;

  function getTypeInfo(type) {
    if (type === '特急') return { en: 'Ltd.Exp.', cls: 'limited' };
    if (type === '急行') return { en: 'Express', cls: 'express' };
    return { en: 'Local', cls: 'local' };
  }

  const destEnglish = {
    "筑紫": "Chikushi",
    "大善寺": "Daizenji",
    "花畑": "Hanabatake",
    "大牟田": "Omuta",
    "二日市": "Futsukaichi",
    "小郡": "Ogori",
    "太宰府": "Dazaifu",
    "柳川": "Yanagawa",
    "久留米": "Kurume"
  };

  function formatDestination(str) {
    if (!str) return { text: '', isSpaced: false };
    // 2文字の場合は文字間にスペースを入れる（例：花 畑、小 郡、大牟田など一律で調整可能）
    if (str.length === 2) {
      return { text: str.split('').join(' '), isSpaced: true };
    }
    return { text: str, isSpaced: false };
  }

  async function loadTimetable(filename) {
    try {
      const response = await fetch(filename);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      currentTimetableData = await response.json();
      updateDisplay();
    } catch (e) {
      console.error('JSON読み込みエラー:', e);
      document.getElementById('train-screen').innerHTML = `<div class="no-trains">データの読み込みに失敗しました<br><small>${filename}</small></div>`;
    }
  }

  function updateDisplay() {
    if (!currentTimetableData || !currentTimetableData.timetable) return;

    const now = new Date();
    const currentHour = now.getHours();
    const currentMinute = now.getMinutes();
    const currentTimeValue = currentHour * 60 + currentMinute;

    let allTrains = [];
    currentTimetableData.timetable.forEach(slot => {
      if (slot.trains) {
        slot.trains.forEach(train => {
          allTrains.push({
            hour: slot.hour,
            minute: train.minute,
            type: train.type,
            destination: train.destination,
            cars: train.cars,
            doors: train.doors,
            note: train.note
          });
        });
      }
    });

    const upcomingTrains = allTrains.filter(train => {
      const trainTimeValue = train.hour * 60 + train.minute;
      return trainTimeValue >= currentTimeValue;
    }).slice(0, 3);

    const screenContainer = document.getElementById('train-screen');
    screenContainer.innerHTML = '';

    if (upcomingTrains.length === 0) {
      screenContainer.innerHTML = <div class="no-trains">本日の運行は終了しました</div>;
      return;
    }

    upcomingTrains.forEach(train => {
      const typeInfo = getTypeInfo(train.type);
      const timeStr = `${String(train.hour).padStart(2, '0')}:${String(train.minute).padStart(2, '0')}`;
      const destEn = destEnglish[train.destination] || train.destination;

      // 種別文字の調整（そのまま表示、またはスペース挟み）
      const formattedType = train.type;
      const destObj = formatDestination(train.destination);
      const destClass = destObj.isSpaced ? 'dest-main spaced' : 'dest-main normal';

      let noticeHtml = '';
      if (train.note) {
        noticeHtml = `
          <div class="notice-row">
            <div class="notice-line">
              <span class="notice-badge">接続案内</span>
              ${train.note}
            </div>
          </div>
        `;
      }

      const rowHtml = `
        <div class="train-row">
          <div class="train-main">
            <div class="type-area">
              <div class="type-badge ${typeInfo.cls}">${formattedType}</div>
              <div class="type-sub">${typeInfo.en}</div>
            </div>
            <div class="dest-area">
              <div class="${destClass}">${destObj.text}</div>
              <div class="dest-sub">${destEn}</div>
            </div>
            <div class="right-group">
              <div class="specs-area">
                <div class="cars-box">${train.cars}両</div>
                <div class="doors-badge">${train.doors || 3}ドア</div>
              </div>
              <div class="time-area">${timeStr}</div>
            </div>
          </div>
          ${noticeHtml}
        </div>
      `;
      screenContainer.innerHTML += rowHtml;
    });
  }

  const fileSelect = document.getElementById('fileSelect');
  fileSelect.addEventListener('change', (e) => {
    loadTimetable(e.target.value);
  });

  loadTimetable(fileSelect.value);
  setInterval(updateDisplay, 10000);
</script>

</body>
</html>
