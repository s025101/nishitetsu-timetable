<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>西鉄電車 発車案内ディスプレイ</title>
    <style>
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: "MS Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-board {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border: 4px solid #1a1a1a;
            background-color: #000000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .board-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background-color: #000000;
            padding: 8px 15px;
            border-bottom: 3px solid #333;
        }

        .station-select {
            background-color: #111;
            color: #fff;
            border: 1px solid #666;
            font-size: 15pt;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* 列車行コンテナ */
        .train-block {
            border-bottom: 3px solid #222;
        }

        .train-row {
            display: grid;
            grid-template-columns: 145px 1fr auto;
            align-items: center;
            background: linear-gradient(to bottom, #001133 0%, #000822 100%);
            padding: 10px 15px;
            border-top: 2px solid #002266;
            gap: 15px;
        }

        /* 左側：種別エリア（文字サイズを大きく調整） */
        .type-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .train-type {
            font-size: 28pt; /* 種別の文字をさらに大きく */
            font-weight: bold;
            padding: 2px 2px 2px 10px;
            text-align: center;
            border: 2px solid #ffffff;
            border-radius: 4px;
            width: 115px;
            letter-spacing: 14px; /* 種別の文字間隔 */
        }

        .type-limited { background-color: #e60012; color: #ffffff; } /* 赤 */
        .type-express { background-color: #009944; color: #ffffff; } /* 緑 */
        .type-local   { background-color: #0044cc; color: #ffffff; } /* 青 */

        .sub-type {
            font-size: 13pt;
            color: #aaaaaa;
            margin-top: 3px;
            margin-left: 2px;
            font-family: sans-serif;
            letter-spacing: 1px;
        }

        /* 中央：行先エリア（3文字分の幅・バランスに調整） */
        .destination-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .destination {
            font-size: 32pt;
            font-weight: bold;
            letter-spacing: 12px; /* 3文字幅のバランスに合わせた文字間隔 */
            margin-left: 6px;
        }

        .sub-destination {
            font-size: 15pt;
            color: #aaaaaa;
            margin-top: 2px;
            font-family: sans-serif;
            letter-spacing: 4px;
            margin-left: 4px;
        }

        /* 右側：時刻・両数・ドア数エリア */
        .info-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .time {
            font-size: 34pt;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
        }

        /* 両数・ドア数グループ */
        .details-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            min-width: 65px;
            gap: 2px;
        }

        .cars-text {
            font-size: 17pt;
            color: #ffffff;
            font-weight: bold;
        }

        /* ドア数バッジ（赤の楕円ピル型枠） */
        .door-badge {
            background-color: #e60012;
            color: #ffffff;
            font-size: 12pt;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 10px;
            border: 1px solid #ff6666;
            text-align: center;
            white-space: nowrap;
        }

        /* 案内メッセージ帯（接続・追越など） */
        .notice-row {
            background-color: #000000;
            border-top: 1px solid #333333;
            padding: 6px 15px;
            font-size: 14pt;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notice-badge {
            background-color: #222222;
            border: 1px solid #777777;
            border-radius: 12px;
            padding: 2px 12px;
            font-size: 12pt;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
        }

        .error-message {
            color: #ff3333;
            text-align: center;
            font-size: 18pt;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="main-board">
        <div class="board-header">
            <div>
                <select id="stationSelect" class="station-select">
                    <option value="T01">T01: 西鉄福岡（天神）</option>
                </select>
            </div>
        </div>

        <div id="boardContent">
            <!-- データがここに読み込まれます -->
        </div>
    </div>

    <script>
        async function loadTimetable() {
            try {
                const today = new Date();
                const dayOfWeek = today.getDay();
                const isHoliday = (dayOfWeek === 0 || dayOfWeek === 6);
                const jsonFileName = isHoliday ? "T01_timetable_holiday.json" : "T01_timetable_weekday.json";

                const response = await fetch(jsonFileName);
                if (!response.ok) throw new Error("ファイルが見つかりません");
                
                const data = await response.json();
                renderBoard(data);
            } catch (error) {
                console.error(error);
                document.getElementById('boardContent').innerHTML = `
                    <div class="error-message">時刻表データの読み込みエラー</div>
                `;
            }
        }

        function renderBoard(data) {
            const container = document.getElementById('boardContent');
            let html = '';

            if (data.trains && data.trains.length > 0) {
                const now = new Date();
                const currentMinutes = now.getHours() * 60 + now.getMinutes();

                let upcomingTrains = data.trains.filter(train => {
                    const parts = train.time.split(':');
                    if (parts.length !== 2) return false;
                    const trainMinutes = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                    return trainMinutes >= currentMinutes;
                });

                if (upcomingTrains.length === 0) {
                    upcomingTrains = data.trains;
                }

                const targetTrains = upcomingTrains.slice(0, 3);

                targetTrains.forEach(train => {
                    let typeClass = 'type-local';
                    if (train.type === '特急') typeClass = 'type-limited';
                    else if (train.type === '急行') typeClass = 'type-express';

                    // 「西鉄柳川」を「柳川」に置き換え
                    let dest = train.destination;
                    if (dest === "西鉄柳川") {
                        dest = "柳川";
                    }

                    html += `
                        <div class="train-block">
                            <div class="train-row">
                                <div class="type-area">
                                    <div class="train-type ${typeClass}">${train.type}</div>
                                    <div class="sub-type">${train.subType || ''}</div>
                                </div>
                                <div class="destination-area">
                                    <div class="destination">${dest}</div>
                                    ${train.subDestination ? `<div class="sub-destination">${train.subDestination}</div>` : ''}
                                </div>
                                <div class="info-area">
                                    <div class="time">${train.time}</div>
                                    <div class="details-group">
                                        <div class="cars-text">${train.cars || ''}</div>
                                        ${train.doors ? `<div class="door-badge">${train.doors}</div>` : ''}
                                    </div>
                                </div>
                            </div>
                    `;

                    if (train.notice) {
                        html += `
                            <div class="notice-row">
                                <span class="notice-badge">${train.noticeType || '案内'}</span>
                                <span>${train.notice}</span>
                            </div>
                        `;
                    }

                    html += `</div>`;
                });
            } else {
                html = '<div class="error-message">本日のダイヤはありません</div>';
            }

            container.innerHTML = html;
        }

        window.onload = loadTimetable;
    </script>
</body>
</html>
