<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>西鉄電車 発車案内ディスプレイ</title>
    <style>
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: "BIZ UDPGothic", "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .main-board {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border: 4px solid #1a1a1a;
            background-color: #000000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .board-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background-color: #000000;
            padding: 8px 15px;
            border-bottom: 3px solid #333;
        }

        .station-select {
            background-color: #111;
            color: #fff;
            border: 1px solid #666;
            font-size: 15pt;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* 列車行コンテナ */
        .train-block {
            border-bottom: 3px solid #222;
        }

        /* 上下2段構成のメイン行 */
        .train-row {
            display: grid;
            grid-template-columns: 145px 1fr auto;
            align-items: center;
            background: linear-gradient(to bottom, #001133 0%, #000822 100%);
            padding: 14px 15px;
            border-top: 2px solid #002266;
            gap: 15px;
        }

        /* 1列目：種別エリア（上下2段） */
        .type-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .train-type {
            font-size: 26pt;
            font-weight: 700;
            padding: 1px 2px 1px 8px;
            text-align: center;
            border: 2px solid #ffffff;
            border-radius: 4px;
            width: 115px;
            letter-spacing: 12px;
        }

        .type-limited { background-color: #e60012; color: #ffffff; } /* 赤：特急 */
        .type-express { background-color: #009944; color: #ffffff; } /* 緑：急行 */
        .type-local   { background-color: #0044cc; color: #ffffff; } /* 青：普通 */

        .sub-type {
            font-size: 13pt;
            color: #ffffff;
            letter-spacing: 1px;
            font-weight: bold;
            text-align: center;
            width: 100%;
        }

        /* 2列目：行先エリア（上下2段） */
        .destination-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 2px;
        }

        /* 行先の幅を固定し、2文字・3文字で綺麗に収まるように調整 */
        .destination {
            font-size: 32pt;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 16px;
            margin-left: 8px;
        }

        /* 2文字の駅名用（文字幅と間隔を調整して3文字分の見た目幅に合わせる） */
        .destination.len-2 {
            letter-spacing: 56px;
            margin-right: -56px;
        }

        .sub-destination {
            font-size: 13pt;
            color: #ffffff;
            letter-spacing: 1px;
            text-align: left;
            margin-left: 8px;
        }

        /* 3列目：時刻エリア */
        .info-area {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .time {
            font-size: 38pt;
            font-weight: 700;
            font-family: "Consolas", "Courier New", monospace;
            letter-spacing: 1px;
        }

        .error-message {
            color: #ff3333;
            text-align: center;
            font-size: 18pt;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="main-board">
        <div class="board-header">
            <div>
                <select id="stationSelect" class="station-select" onchange="changeStation()">
                    <option value="T01">T01: 西鉄福岡（天神）</option>
                    <option value="T11">T11: 都府楼前</option>
                </select>
            </div>
        </div>

        <div id="boardContent">
            <!-- データがここに読み込まれます -->
        </div>
    </div>

    <script>
        async function loadTimetable(stationCode) {
            try {
                // 選択された駅コードに応じたJSONファイルを読み込む
                const filename = `${stationCode}_timetable_holiday.json`;
                const response = await fetch(filename);
                if (!response.ok) throw new Error("ファイルが見つかりません: " + filename);
                
                const data = await response.json();
                renderBoard(data);
            } catch (error) {
                console.error(error);
                document.getElementById('boardContent').innerHTML = `
                    <div class="error-message">時刻表データの読み込みエラー (${stationCode})</div>
                `;
            }
        }

        function changeStation() {
            const select = document.getElementById('stationSelect');
            const stationCode = select.value;
            loadTimetable(stationCode);
        }

        function getSubType(type) {
            if (type === '特急') return 'Ltd.Exp';
            if (type === '急行') return 'Express';
            if (type === '普通') return 'Local';
            return '';
        }

        function getSubDestination(dest) {
            const map = {
                '大牟田': 'Ōmuta',
                '西鉄柳川': 'Yanagawa',
                '柳川': 'Yanagawa',
                '花畑': 'Hanabatake',
                '大善寺': 'Daizenji',
                '津福': 'Tsubuku',
                '小郡': 'Ogōri',
                '筑紫': 'Chikushi',
                '二日市': 'Futsukaichi',
                '太宰府': 'Dazaifu',
                '西鉄福岡': 'Nishitetsu Fukuoka'
            };
            return map[dest] || '';
        }

        function renderBoard(data) {
            const container = document.getElementById('boardContent');
            let html = '';

            if (data.trains && data.trains.length > 0) {
                const now = new Date();
                const currentMinutes = now.getHours() * 60 + now.getMinutes();

                let upcomingTrains = data.trains.filter(train => {
                    const parts = train.time.split(':');
                    if (parts.length !== 2) return false;
                    const trainMinutes = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                    return trainMinutes >= currentMinutes;
                });

                if (upcomingTrains.length === 0) {
                    upcomingTrains = data.trains;
                }

                // 3列車分（3行）に抽出
                const targetTrains = upcomingTrains.slice(0, 3);

                targetTrains.forEach(train => {
                    let typeClass = 'type-local';
                    if (train.type === '特急') typeClass = 'type-limited';
                    else if (train.type === '急行') typeClass = 'type-express';

                    let dest = train.destination;
                    if (dest && dest.includes("西鉄柳川")) {
                        dest = "柳川";
                    }

                    const subType = getSubType(train.type);
                    const subDest = getSubDestination(dest);
                    const lenClass = (dest && dest.length === 2) ? 'len-2' : '';

                    html += `
                        <div class="train-block">
                            <div class="train-row">
                                <div class="type-area">
                                    <div class="train-type ${typeClass}">${train.type}</div>
                                    <div class="sub-type">${subType}</div>
                                </div>

                                <div class="destination-area">
                                    <div class="destination ${lenClass}">${dest}</div>
                                    <div class="sub-destination">${subDest}</div>
                                </div>

                                <div class="info-area">
                                    <div class="time">${train.time}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html = '<div class="error-message">本日のダイヤはありません</div>';
            }

            container.innerHTML = html;
        }

        // 初期ロードはT01から
        window.onload = function() {
            loadTimetable('T01');
        };
    </script>
</body>
</html>
